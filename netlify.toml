[build]
  base    = "debora-learns-law"
  command = "npm run build"
  publish = "debora-learns-law/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — currently single-page, but future-proofs client routes
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Force the apex to the canonical www host (set up in Netlify after domain add)
[[redirects]]
  from   = "https://studilaw.com/*"
  to     = "https://www.studilaw.com/:splat"
  status = 301
  force  = true

# Hashed assets are content-addressed — cache them hard
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache the HTML shell so new deploys go live immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sensible defaults; the game has no third-party scripts
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
